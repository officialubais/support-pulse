<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SupportPulse — E-Commerce Support Assistant</title>
<!-- Google Fonts & Material Symbols -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">

<style>
  :root {
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --accent-light: #eef2ff;
    --accent-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    --bg: #f8fafc;
    --border: #e2e8f0;
    --card-bg: #ffffff;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
    --user-bubble: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 14px -2px rgba(15, 23, 42, 0.08);
    --radius: 12px;
  }

  [data-theme="dark"] {
    --accent: #6366f1;
    --accent-hover: #818cf8;
    --accent-light: rgba(99, 102, 241, 0.18);
    --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    --bg: #0f172a;
    --border: #334155;
    --card-bg: #1e293b;
    --text-primary: #f8fafc;
    --text-secondary: #cbd5e1;
    --text-muted: #64748b;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    transition: background-color 0.3s, color 0.3s;
  }

  /* Header */
  header {
    background: var(--accent-gradient);
    color: #fff;
    padding: 0.85rem 1.5rem;
    box-shadow: var(--shadow-md);
    z-index: 10;
  }
  .header-content {
    max-width: 880px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-weight: 700;
    font-size: 1.25rem;
    letter-spacing: -0.02em;
  }
  .brand .material-symbols-outlined {
    font-size: 1.6rem;
    color: #c7d2fe;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .header-btn {
    background: rgba(255, 255, 255, 0.15);
    border: none;
    color: #fff;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  .header-btn:hover {
    background: rgba(255, 255, 255, 0.28);
    transform: scale(1.05);
  }
  .badge {
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(4px);
    font-size: 0.75rem;
    font-weight: 600;
    padding: 0.25rem 0.6rem;
    border-radius: 20px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  /* Main Container */
  #main-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 880px;
    width: 100%;
    margin: 0 auto;
    height: calc(100vh - 68px);
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    scroll-behavior: smooth;
  }
  #log::-webkit-scrollbar { width: 6px; }
  #log::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

  /* Message Rows */
  .msg-row {
    display: flex;
    gap: 0.75rem;
    align-items: flex-start;
    width: 100%;
  }
  .msg-row.user { flex-direction: row-reverse; }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 1rem;
    font-weight: 600;
  }
  .msg-row.agent .avatar {
    background: var(--accent-light);
    color: var(--accent);
    border: 1px solid var(--border);
  }
  .msg-row.user .avatar {
    background: #0f172a;
    color: #fff;
  }

  .msg-wrapper {
    max-width: 82%;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }
  .msg-row.user .msg-wrapper { align-items: flex-end; }

  .sender-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-weight: 500;
    padding: 0 0.2rem;
  }

  .bubble {
    padding: 0.85rem 1.15rem;
    border-radius: 16px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    color: var(--text-primary);
    font-size: 0.95rem;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg-row.user .bubble {
    background: var(--user-bubble);
    color: #ffffff;
    border: none;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
  }
  .msg-row.agent .bubble {
    border-bottom-left-radius: 4px;
  }

  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    white-space: normal;
    box-shadow: none;
  }

  /* Animated Typing Indicator */
  .typing-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0.4rem 0.2rem;
    color: var(--text-muted);
    font-size: 0.85rem;
    font-weight: 500;
  }
  .typing-dots {
    display: inline-flex;
    gap: 4px;
    align-items: center;
  }
  .dot {
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulseBounce 1.4s infinite ease-in-out both;
  }
  .dot:nth-child(1) { animation-delay: 0s; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulseBounce {
    0%, 80%, 100% { transform: scale(0.3); opacity: 0.3; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* Order Progress Stepper Component */
  .order-stepper {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 0.8rem 0;
    padding: 0.75rem;
    background: var(--accent-light);
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .step-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.2rem;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
  }
  .step-item.active {
    color: var(--accent);
  }
  .step-icon {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--card-bg);
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
  }
  .step-item.active .step-icon {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
  }
  .step-line {
    flex: 1;
    height: 2px;
    background: var(--border);
    margin: 0 0.4rem;
  }
  .step-line.active { background: var(--accent); }

  /* Prompt Suggestions Row */
  #suggestions {
    padding: 0.5rem 1.5rem 0.25rem 1.5rem;
    display: flex;
    gap: 0.6rem;
    overflow-x: auto;
    align-items: center;
  }
  #suggestions::-webkit-scrollbar { display: none; }
  .suggestion-chip {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 0.45rem 0.9rem;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    box-shadow: var(--shadow-sm);
  }
  .suggestion-chip:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-light);
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }

  /* Input Form */
  form {
    display: flex;
    gap: 0.75rem;
    padding: 1rem 1.5rem;
    border-top: 1px solid var(--border);
    background: var(--card-bg);
  }
  input {
    flex: 1;
    padding: 0.75rem 1rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 0.95rem;
    font-family: inherit;
    background: var(--bg);
    color: var(--text-primary);
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
  }
  button[type="submit"] {
    padding: 0.75rem 1.25rem;
    border: none;
    border-radius: var(--radius);
    background: var(--accent-gradient);
    color: #fff;
    font-weight: 600;
    font-size: 0.95rem;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    transition: opacity 0.2s, transform 0.1s;
  }
  button[type="submit"]:hover {
    opacity: 0.95;
    transform: translateY(-1px);
  }

  /* Lightbox Modal */
  .lightbox-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(6px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .lightbox-content {
    max-width: 90%;
    max-height: 90%;
    border-radius: 12px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    overflow: hidden;
  }
  .lightbox-content img {
    max-width: 100%;
    max-height: 80vh;
    display: block;
  }

  /* A2UI components */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.25rem;
    background: var(--card-bg);
    box-shadow: var(--shadow-md);
    max-width: 100%;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.6rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; color: var(--text-primary); }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em; }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-muted); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.6rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 10px; display: block; box-shadow: var(--shadow-sm); cursor: zoom-in; }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.2rem; line-height: 1; vertical-align: middle; }
</style>
</head>
<body>

<header>
  <div class="header-content">
    <div class="brand">
      <span class="material-symbols-outlined">pulse_alert</span>
      <span>SupportPulse</span>
      <span class="badge">E-Commerce</span>
    </div>
    <div class="header-actions">
      <button type="button" class="header-btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
        <span class="material-symbols-outlined" id="theme-icon">dark_mode</span>
      </button>
      <button type="button" class="header-btn" onclick="exportChat()" title="Export Chat Transcript">
        <span class="material-symbols-outlined">download</span>
      </button>
      <button type="button" class="header-btn" onclick="resetChat()" title="Start New Chat Session">
        <span class="material-symbols-outlined">refresh</span>
      </button>
    </div>
  </div>
</header>

<div id="main-container">
  <div id="log"></div>

  <!-- Prompt Suggestions Row -->
  <div id="suggestions">
    <button type="button" class="suggestion-chip" onclick="sendPrompt('Track order ORD-1001 and check shipping status')">
      <span>📦</span> Track Order ORD-1001
    </button>
    <button type="button" class="suggestion-chip" onclick="sendPrompt('Calculate refund for returning Wireless Headphones')">
      <span>🎧</span> Calculate Refund (Headphones)
    </button>
    <button type="button" class="suggestion-chip" onclick="sendPrompt('Check inventory for Mechanical Keyboard in Seattle WA')">
      <span>📍</span> Check Keyboard Inventory
    </button>
  </div>

  <form id="form">
    <input id="input" placeholder="Ask SupportPulse about your order, inventory, or returns…" autocomplete="off" autofocus>
    <button type="submit">
      <span>Send</span>
      <span class="material-symbols-outlined" style="font-size:1.1rem; color:#fff;">send</span>
    </button>
  </form>
</div>

<!-- Image Lightbox Overlay -->
<div id="lightbox" class="lightbox-overlay" onclick="closeLightbox()">
  <div class="lightbox-content">
    <img id="lightbox-img" src="" alt="Enlarged view">
  </div>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

// Theme Toggle
function toggleTheme() {
  const current = document.body.getAttribute("data-theme");
  const next = current === "dark" ? "light" : "dark";
  document.body.setAttribute("data-theme", next);
  document.getElementById("theme-icon").textContent = next === "dark" ? "light_mode" : "dark_mode";
}

// Export Chat Transcript
function exportChat() {
  const rows = log.querySelectorAll(".msg-row");
  if (!rows.length) return alert("No conversation transcript to export.");
  let text = "# SupportPulse Chat Transcript\n\n";
  rows.forEach(r => {
    const isUser = r.classList.contains("user");
    const bubble = r.querySelector(".bubble");
    text += `### ${isUser ? "You" : "SupportPulse AI"}\n${bubble ? bubble.textContent.trim() : ""}\n\n`;
  });
  const blob = new Blob([text], { type: "text/markdown" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `supportpulse_transcript_${Date.now()}.md`;
  a.click();
}

// Reset Chat Session
function resetChat() {
  if (confirm("Start a new conversation session?")) {
    log.innerHTML = "";
    input.value = "";
    input.focus();
  }
}

// Lightbox modal controls
function openLightbox(src) {
  lightboxImg.src = src;
  lightbox.style.display = "flex";
}
function closeLightbox() {
  lightbox.style.display = "none";
}

function bubble(who) {
  const row = el("div", "msg-row " + who);

  const avatar = el("div", "avatar");
  if (who === "agent") {
    avatar.innerHTML = `<span class="material-symbols-outlined" style="font-size:1.1rem">support_agent</span>`;
  } else {
    avatar.innerHTML = `<span class="material-symbols-outlined" style="font-size:1.1rem">person</span>`;
  }

  const wrapper = el("div", "msg-wrapper");
  const label = el("div", "sender-label", who === "agent" ? "SupportPulse AI" : "You");
  const b = el("div", "bubble");

  wrapper.appendChild(label);
  wrapper.appendChild(b);

  row.appendChild(avatar);
  row.appendChild(wrapper);

  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return b;
}

function showTypingIndicator(promptText) {
  let statusText = "SupportPulse is processing your request…";
  if (promptText) {
    const t = promptText.toLowerCase();
    if (t.includes("video") || t.includes("clip") || t.includes("commercial")) {
      statusText = "SupportPulse is generating HD product video using Vertex AI Veo 3.1…";
    } else if (t.includes("image") || t.includes("picture") || t.includes("photo") || t.includes("draw") || t.includes("generate")) {
      statusText = "SupportPulse is generating product image using Imagen 3…";
    } else if (t.includes("order") || t.includes("track") || t.includes("status") || t.includes("ord-")) {
      statusText = "SupportPulse is checking order database & tracking status…";
    } else if (t.includes("recommend") || t.includes("keyboard") || t.includes("headphone") || t.includes("product") || t.includes("catalog") || t.includes("price")) {
      statusText = "SupportPulse is searching product catalog & memory bank…";
    } else if (t.includes("return") || t.includes("refund") || t.includes("policy")) {
      statusText = "SupportPulse is checking store return policy & memory bank…";
    } else {
      statusText = `SupportPulse is processing "${promptText.length > 30 ? promptText.slice(0, 30) + '…' : promptText}"…`;
    }
  }
  const b = bubble("agent");
  b.innerHTML = `
    <div class="typing-indicator">
      <div class="typing-dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <span>${statusText}</span>
    </div>
  `;
  return b;
}

function sendPrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
}

/* Helper to render visual Order Progress Stepper */
function renderOrderStepper(container, textContent) {
  if (!/ORD-\d+/i.test(textContent) && !/shipped|delivered|processing/i.test(textContent)) return;

  const stepper = el("div", "order-stepper");
  const steps = [
    { label: "Placed", icon: "✓" },
    { label: "Processing", icon: "⚙" },
    { label: "In Transit", icon: "🚚" },
    { label: "Delivered", icon: "📦" }
  ];

  let currentStepIndex = 2; // Default to In Transit for tracking demos
  if (/delivered/i.test(textContent)) currentStepIndex = 3;
  else if (/processing/i.test(textContent)) currentStepIndex = 1;

  steps.forEach((s, idx) => {
    const item = el("div", "step-item" + (idx <= currentStepIndex ? " active" : ""));
    const icon = el("div", "step-icon", s.icon);
    const label = el("span", null, s.label);
    item.appendChild(icon);
    item.appendChild(label);
    stepper.appendChild(item);

    if (idx < steps.length - 1) {
      const line = el("div", "step-line" + (idx < currentStepIndex ? " active" : ""));
      stepper.appendChild(line);
    }
  });

  container.appendChild(stepper);
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset + Lightbox & Stepper).
 * -------------------------------------------------------------------------- */
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      const val = boundStr(props.text);
      if (/https?:\/\/[^\s\)]+\.(?:mp4|webm|png|jpg|jpeg|webp)/i.test(val)) {
        t.innerHTML = renderMarkdownAndMedia(val);
      } else {
        t.textContent = val;
      }
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img");
      img.src = src;
      img.alt = boundStr(props.alt) || "";
      img.onclick = () => openLightbox(src);
      return img;
    }
    case "Video":
    case "Media": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const wrap = el("div");
      wrap.style.margin = "0.75rem 0";
      const vid = el("video");
      vid.controls = true;
      vid.autoplay = true;
      vid.loop = true;
      vid.muted = true;
      vid.style.maxWidth = "100%";
      vid.style.borderRadius = "12px";
      vid.style.boxShadow = "var(--shadow-md)";
      vid.style.border = "1px solid var(--border)";
      vid.style.display = "block";
      const source = el("source");
      source.src = src;
      source.type = "video/mp4";
      vid.appendChild(source);
      wrap.appendChild(vid);
      return wrap;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderMarkdownAndMedia(text) {
  if (!text) return "";
  let html = text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

  // Video URLs: https://storage.googleapis.com/.../*.mp4
  html = html.replace(/(https?:\/\/storage\.googleapis\.com\/[^\s\)]+\.mp4)/gi, function(match) {
    return `<div style="margin: 0.75rem 0;">
      <video controls autoplay loop muted style="max-width: 100%; border-radius: 12px; box-shadow: var(--shadow-md); border: 1px solid var(--border); display: block;">
        <source src="${match}" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      <div style="font-size: 0.78rem; color: var(--text-muted); margin-top: 0.3rem;">🎬 Generated Product Video (Google Omni)</div>
    </div>`;
  });

  // Markdown Images: ![alt](url)
  html = html.replace(/!\[([^\]]*)\]\((https?:\/\/[^\)]+)\)/gi, function(match, alt, url) {
    if (/\.mp4$/i.test(url)) {
      return `<div style="margin: 0.75rem 0;">
        <video controls autoplay loop muted style="max-width: 100%; border-radius: 12px; box-shadow: var(--shadow-md); border: 1px solid var(--border); display: block;">
          <source src="${url}" type="video/mp4">
        </video>
      </div>`;
    }
    return `<img src="${url}" alt="${alt}" class="a2img" style="max-width: 100%; border-radius: 12px; margin: 0.6rem 0; cursor: zoom-in; box-shadow: var(--shadow-md);" onclick="openLightbox('${url}')">`;
  });

  // Plain Image URLs: https://storage.googleapis.com/.../*.png or jpg
  html = html.replace(/(?<!src=")(https?:\/\/storage\.googleapis\.com\/[^\s\)]+\.(?:png|jpg|jpeg|webp))/gi, function(match) {
    return `<img src="${match}" class="a2img" style="max-width: 100%; border-radius: 12px; margin: 0.6rem 0; cursor: zoom-in; box-shadow: var(--shadow-md);" onclick="openLightbox('${match}')">`;
  });

  // Basic formatting: headers, bold, bullet lists
  html = html
    .replace(/^### (.*$)/gim, '<h3 style="font-size:1.05rem; font-weight:700; margin:0.5rem 0 0.2rem 0;">$1</h3>')
    .replace(/^## (.*$)/gim, '<h2 style="font-size:1.15rem; font-weight:700; margin:0.6rem 0 0.3rem 0;">$1</h2>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/^\- (.*$)/gim, '• $1<br>');

  return html;
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) {
    const htmlContent = renderMarkdownAndMedia(textStr);
    const textNode = el("div");
    textNode.innerHTML = htmlContent;
    b.appendChild(textNode);
    renderOrderStepper(b, textStr);
  }

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";

  // Add click handlers for any rendered images
  b.querySelectorAll("img").forEach(img => {
    img.style.cursor = "zoom-in";
    img.onclick = () => openLightbox(img.src);
  });

  // Auto-scroll log to bottom smoothly
  setTimeout(() => {
    log.scrollTop = log.scrollHeight;
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }, 100);
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = showTypingIndicator(text);
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
